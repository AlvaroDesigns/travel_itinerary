<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b2a" />
      <stop offset="100%" stop-color="#1d113a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0066FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#brandGrad)" stroke-width="6" opacity="0.3" stroke-dasharray="16 12" />

  <!-- Main Compass & World Globe Elements -->
  <g filter="url(#glow)" transform="translate(256, 256)">
    <!-- Globe Lines -->
    <circle r="140" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.9" />
    <ellipse rx="70" ry="140" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.75" />
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#ffffff" stroke-width="10" opacity="0.75" />
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#ffffff" stroke-width="10" opacity="0.75" />
    <line x1="-118" y1="-75" x2="118" y2="-75" stroke="#ffffff" stroke-width="8" opacity="0.5" />
    <line x1="-118" y1="75" x2="118" y2="75" stroke="#ffffff" stroke-width="8" opacity="0.5" />

    <!-- Center Compass Diamond Star in Teal -->
    <path d="M 0,-105 L 24,-24 L 105,0 L 24,24 L 0,105 L -24,24 L -105,0 L -24,-24 Z" fill="url(#brandGrad)" />
    
    <!-- Airplane Ascent Silhouette in White -->
    <path d="M -8,12 L 0,-24 L 8,12 L 28,18 L 10,24 L 16,40 L 0,32 L -16,40 L -10,24 L -28,18 Z" fill="#ffffff" />

    <!-- Central Core Spark -->
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>
</svg>
